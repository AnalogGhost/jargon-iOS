name: Jargon
options:
  bundleIdPrefix: com.hackerapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

targets:
  Jargon:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Jargon
        CFBundleDisplayName: Jargon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hackerapps.jargon
      SWIFT_VERSION: "5.9"
      DEVELOPMENT_TEAM: 6BRG6VVP3H
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  JargonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jargon.app/Jargon"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Jargon

  JargonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Jargon

schemes:
  Jargon:
    build:
      targets:
        Jargon: all
        JargonTests: [test]
        JargonUITests: [test]
    test:
      config: Debug
      targets:
        - JargonTests
        - JargonUITests
