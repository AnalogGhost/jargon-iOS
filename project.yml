name: Jargon
options:
  bundleIdPrefix: com.hackerapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

# Shared by the app and the widget extension, which App Store Connect requires to
# carry the same version. The build number is overridden at archive time (Fastfile).
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Jargon:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Jargon
        CFBundleDisplayName: Jargon
        # Version is defined once, in the target's build settings below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # actool nests CFBundleIconName under CFBundlePrimaryIcon but doesn't emit
        # the top-level key App Store Connect's binary check (90713) requires.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Home Screen quick action — long-press the app icon (see QuickActions.swift).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.hackerapps.jargon.random-entry
            UIApplicationShortcutItemTitle: Random entry
            UIApplicationShortcutItemIconSymbolName: shuffle
        # jargon://entry/<id> — the widget's tap target (see EntryLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.hackerapps.jargon
            CFBundleURLSchemes:
              - jargon
        # Spotlight's "Search in App" hands the query to the app's search field.
        CoreSpotlightContinuation: true
    settings:
      base:
        PRODUCT_NAME: Jargon
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerapps.jargon
        # Names the asset-catalog set that is the app icon. Without this the
        # compiler emits no CFBundleIconName and App Store Connect rejects the
        # binary (90713 / 90022 — "missing required icon").
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 6BRG6VVP3H
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Debug:
          SWIFT_ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
    dependencies:
      - target: JargonWidgets
        embed: true

  # Word-of-the-day widget. Compiles only the data files it needs and reads the
  # dictionary from the containing app's bundle rather than shipping a second copy.
  JargonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Data/DictionaryEntry.swift
      - path: Sources/Data/DictionaryRepository.swift
      - path: Sources/Data/WordOfTheDay.swift
      - path: Sources/Data/EntryLink.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Jargon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: JargonWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerapps.jargon.widgets
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 6BRG6VVP3H
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES

  JargonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      PRODUCT_NAME: JargonTests
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jargon.app/Jargon"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Jargon

  JargonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      PRODUCT_NAME: JargonUITests
      SWIFT_VERSION: "5.9"
      # Universal, so the runner sees the real idiom on iPad (the screenshot
      # walkthrough branches on it) instead of running in iPhone compatibility mode.
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Jargon
    dependencies:
      - target: Jargon

schemes:
  # Default scheme — unit tests + functional UI tests. This is what CI runs on
  # every push. The screenshot walkthrough is skipped here (it's driven by
  # `fastlane snapshot` via the JargonUITests scheme below) so CI stays lean.
  Jargon:
    build:
      targets:
        Jargon: all
        JargonTests: [test]
        JargonUITests: [test]
    test:
      config: Debug
      targets:
        - name: JargonTests
        - name: JargonUITests
          skippedTests:
            - ScreenshotCapture
            - HomeScreenCapture

  # Screenshot walkthrough. Driven by `fastlane snapshot`; kept out of the
  # default scheme so ordinary `xcodebuild test` runs stay fast.
  JargonUITests:
    build:
      targets:
        Jargon: all
        JargonUITests: [test]
    test:
      config: Debug
      targets:
        - JargonUITests
