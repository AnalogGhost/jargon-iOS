name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The runner image's default Xcode ships with its iOS Simulator runtime.
      # Switching to `latest-stable` landed on an Xcode whose runtime wasn't cached,
      # and `xcodebuild -downloadPlatform iOS` can't fetch one on the runner.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # A hardcoded device name (e.g. "iPhone 16") breaks once Apple's simulator
      # lineup rotates it out. Pick whatever iPhone the newest installed iOS
      # runtime offers instead.
      - name: Pick a simulator destination
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("com.apple.CoreSimulator.SimRuntime.iOS")))
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | (.maj|tonumber)*100 + (.min|tonumber))
            | last.value
            | map(select(.name | test("^iPhone")))
            | first.name
          ')
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run unit + UI tests
        run: |
          xcodebuild \
            -scheme Jargon \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -retry-tests-on-failure \
            test

      - name: Check screenshot builder
        run: |
          python3 -m py_compile Tools/StoreScreenshots/build.py
          python3 -m json.tool Tools/StoreScreenshots/captions.json > /dev/null

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
